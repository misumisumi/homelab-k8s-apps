apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: kube-system
spec:
  hostnames:
    - "argocd.dev.misumi-sumi.com"
  parentRefs:
    - name: public-gateway
      namespace: kube-system
  rules:
    - backendRefs:
        - name: argocd-server
          namespace: argocd
          port: 80
