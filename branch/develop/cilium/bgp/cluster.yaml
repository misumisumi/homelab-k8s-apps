apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp
spec:
  nodeSelector:
    matchLabels:
      "kubernetes.io/os": linux
  bgpInstances:
    - name: instance-65300
      localASN: 65300
      peers:
        - name: peer-65200-tor
          peerASN: 65200
          peerAddress: "172.16.100.5"
          peerConfigRef:
            name: cilium-peer
