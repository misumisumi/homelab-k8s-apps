apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    allowUnsupported: false
    image: quay.io/ceph/ceph:v20.2.2
  dashboard:
    enabled: true
  dataDirHostPath: /var/lib/rook
  mgr:
    count: 2
  mon:
    allowMultiplePerNode: false
    count: 3
  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: role.worker
                  operator: In
                  values:
                    - ceph
  resources:
    mgr:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
    mon:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
    osd:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: "1"
        memory: 1Gi
  storage:
    nodes:
      - devices:
          - name: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_incus_ceph_disk_01
          - name: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_incus_ceph_disk_02
        name: ceph-worker1
      - devices:
          - name: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_incus_ceph_disk_01
          - name: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_incus_ceph_disk_02
        name: ceph-worker2
      - devices:
          - name: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_incus_ceph_disk_01
          - name: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_incus_ceph_disk_02
        name: ceph-worker3
    useAllNodes: false
