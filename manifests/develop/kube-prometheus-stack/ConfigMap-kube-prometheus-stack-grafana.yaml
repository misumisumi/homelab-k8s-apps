apiVersion: v1
data:
  grafana.ini: |
    [analytics]
    check_for_updates = true
    [auth.github]
    allow_sign_up = true
    allowed_organizations = misumi-homelab
    allowed_teams = misumi-homelab:homelab-dev-admin
    client_id = $__env{GF_AUTH_GITHUB_CLIENT_ID}
    client_secret = $__env{GF_AUTH_GITHUB_CLIENT_SECRET}
    enabled = true
    role_attribute_path = contains(groups[*], 'misumi-homelab:homelab-dev-admin') && 'Admin' || 'Viewer'
    [log]
    mode = console
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [server]
    domain = grafana.dev.misumi-sumi.com
    root_url = https://grafana.dev.misumi-sumi.com
    [unified_storage]
    index_path = /var/lib/grafana-search/bleve
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: 13.1.2
    helm.sh/chart: grafana-12.10.3
  name: kube-prometheus-stack-grafana
  namespace: monitoring
