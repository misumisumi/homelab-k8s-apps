apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./k8s-apps/manifests/develop/gateway
    repoURL: https://github.com/misumisumi/nixos-k8s-config.git
    targetRevision: refactor/k8s
  syncPolicy: {}
