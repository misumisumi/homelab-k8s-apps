apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./manifests/develop/kube-prometheus-stack
    repoURL: https://github.com/misumisumi/homelab-k8s-apps.git
    targetRevision: develop
  syncPolicy: {}
