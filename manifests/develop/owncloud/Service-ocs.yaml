apiVersion: v1
kind: Service
metadata:
  labels:
    app: ocs
    app.kubernetes.io/instance: ocis
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ocis
    app.kubernetes.io/version: 7.1.4
    helm.sh/chart: ocis-0.7.0
    ocis-metrics: enabled
  name: ocs
  namespace: owncloud
spec:
  ports:
    - appProtocol: http
      name: http
      port: 9110
      protocol: TCP
    - appProtocol: http
      name: metrics-debug
      port: 9114
      protocol: TCP
  selector:
    app: ocs
