apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ssh
spec:
  ingress:
    - fromEntities:
        - cluster
    - toPorts:
        - ports:
            - port: "22"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "4240"
              protocol: TCP
            - port: "8472"
              protocol: UDP
            - protocol: VRRP
    - icmps:
        - fields:
            - family: IPv4
              type: EchoRequest
  nodeSelector:
    matchLabels:
      node-access: ssh
